# The deploy for the agent-workbench stack (kb-serve, artifact-serve, bdui,
# n8n), run with `podman-compose up -d` or `docker compose up -d`.
#
# Compose is the ONLY deploy path. The systemd quadlet units this file used
# to coexist with have been deleted from the repo; nothing here depends on
# systemd, so the same file works on any host with a container runtime.
#
# See README.md for the fresh-machine install steps.

services:
  kb-serve:
    build:
      context: ./scripts
      dockerfile: kb-container/Containerfile
    image: localhost/kb-serve:latest
    # No `user:` override -- PROVEN broken, not just a cosmetic gap, same
    # as artifact-serve/bdui below. `user: "${UID:-1000}:${GID:-1000}"`
    # sets the container-internal uid, but plain compose has no real
    # UserNS=keep-id remap: verified via `podman unshare cat
    # /proc/self/uid_map` that container uid 1000 lands on an unrelated
    # host subuid (525287 on this host), which owns nothing on the
    # ~/.knowledgebase mount. kb.env is 0644 under a 0755 dir, so DAC
    # alone would have permitted that read at subuid 525287 -- the
    # PermissionError actually seen at startup was SELinux blocking it
    # first (see the volumes comment below), which is what surfaced the
    # problem before a write ever got the chance to EACCES on the DAC
    # side. Every write route (`kb put`/`clip`/`decision`/`atomize`/
    # `reindex`) still needs real ownership, so the DAC fix is required
    # regardless of which failure was seen first. Omitting
    # `user:` runs root-in-container, which under rootless podman's
    # default subuid mapping IS the invoking host user for file-ownership
    # purposes -- cap_drop ALL + no-new-privileges + read_only rootfs
    # still apply, so this isn't a meaningfully weaker container.
    environment:
      KB_SERVE_HOST: "0.0.0.0"
      KB_SERVE_PORT: "9100"
      HOME: "${HOME}"
      KB_HOME: "${HOME}/.knowledgebase"
    # Real, gitignored env file (not the tracked kb.env.example) -- may not
    # exist yet on a fresh host; create it from kb.env.example before
    # first `up`. Carries KB_ENRICH, KB_LLM_BASE_URL, KB_LLM_MODEL, and
    # optionally KB_LLM_API_KEY or KB_LLM_API_KEY_CMD.
    #
    # Nuance vs. the quadlet: the quadlet resolves KB_LLM_API_KEY_CMD
    # host-side via ExecStartPre before the container ever starts, so the
    # container itself never needs the vault CLI. Compose has no
    # pre-start hook, so here kb-serve.py's own resolve_api_key() runs the
    # _CMD in-process INSIDE the container instead. If the vault CLI
    # isn't available in-container, it just logs a warning and returns no
    # key -- a safe no-op, since KB_ENRICH defaults to 0 anyway.
    env_file:
      - "${HOME}/.knowledgebase/kb.env"
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      # :z relabels the mount to container_file_t for shared container
      # access. Without it, SELinux denies the container's context read on
      # the host's user_home_t label -- a type denial (confirmed by the
      # container's PermissionError plus the DAC perms being otherwise
      # sufficient), not the private-MCS-category case `:Z` applies instead.
      # Combined with dropping `user:` above (the DAC half of the same
      # class of problem bd-serve/bdui already hit), this is the narrower
      # sibling of their `security_opt: label:disable` fix: only this one
      # mount gets relabeled rather than disabling SELinux confinement for
      # the whole container.
      - "${HOME}/.knowledgebase:${HOME}/.knowledgebase:rw,z"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      # Mirrors the Containerfile's baked HEALTHCHECK.
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('KB_SERVE_PORT','9100')+'/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  bd-serve:
    build:
      context: ./scripts
      dockerfile: bd-container/Containerfile
    image: localhost/bd-serve:latest
    # Mirrors bdui's proven bind-mount security stance: no `user:`
    # override, and SELinux labeling disabled because bd board dirs are
    # 0700/0600 on this enforcing host.
    environment:
      BD_SERVE_HOST: "0.0.0.0"
      BD_SERVE_PORT: "9101"
      # Container-internal HOME, NOT the host's -- same gotcha bdui hit:
      # `bd` wants a writable home for its own config/cache, and the
      # read_only rootfs would reject it. /tmp is the tmpfs below. The
      # `${HOME}` in BEADS_HUB_DIR/volumes is a compose substitution for
      # the HOST home dir and is unrelated to this; keep them different.
      HOME: "/tmp"
      BEADS_HUB_DIR: "${HOME}/.beads-hub"
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - "${HOME}/.beads-hub:${HOME}/.beads-hub:rw"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "label:disable"
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('BD_SERVE_PORT','9101')+'/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  artifact-serve:
    build:
      context: ./apps/artifact-review
      dockerfile: Containerfile
      target: runtime
    image: localhost/artifact-review:latest
    # No `user:` override here -- PROVEN broken for this service, not just a
    # cosmetic gap. Plain compose has no real UserNS=keep-id, so
    # `user: "1000:1000"` maps to an unrelated host subuid that owns nothing
    # on the mount, making writes fail with permission denied. Omitting `user:`
    # runs root-in-container, which under rootless podman's default subuid
    # mapping IS the invoking host user for file-ownership purposes.
    # cap_drop ALL + no-new-privileges + read_only rootfs still apply, so this
    # is not a meaningfully weaker container despite the nominal root label.
    environment:
      ARTIFACT_SERVE_HOST: "0.0.0.0"
      ARTIFACT_SERVE_PORT: "9099"
      ARTIFACT_SERVE_ALLOWED_HOSTS: "127.0.0.1,localhost"
      ARTIFACT_SERVE_STAGE_ROOT: "/tmp/artifacts"
      ARTIFACT_SERVE_FEEDBACK_ROOT: "${HOME}/.local/share/artifacts"
      DJANGO_DEBUG: "0"
      HOME: "${HOME}"
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      # /tmp is otherwise tmpfs inside the read-only container; verified
      # this bind mount survives that tmpfs and remains visible on the host.
      # Shared SELinux relabel is required for both mounts; without it,
      # publish hit EACCES on the feedback root despite correct DAC perms.
      - /tmp/artifacts:/tmp/artifacts:rw,z
      - "${HOME}/.local/share/artifacts:${HOME}/.local/share/artifacts:rw,z"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      # Mirrors the Containerfile's baked HEALTHCHECK.
      test:
        - CMD
        - python3
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('ARTIFACT_SERVE_PORT','9099')+'/_/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  bdui:
    build:
      context: ./scripts/bdui-container
      dockerfile: Containerfile
    image: localhost/bdui:latest
    # No `user:` override here, unlike kb-serve/artifact-serve -- PROVEN
    # broken for this service, not just a cosmetic approximation gap (their
    # own `user:` comment already says "drop it if it doesn't translate
    # cleanly"). Verified two-part failure and two-part fix:
    #   1) SELinux (enforcing on this host): a bind mount gets a private
    #      MCS category unless labeling is disabled, so even root-in-
    #      container got EACCES on the mount -- fixed by
    #      `security_opt: label:disable` below (compose equivalent of the
    #      quadlets' `SecurityLabelDisable=true`).
    #   2) DAC: bd's board dirs are 0700/0600, owned (as seen from inside
    #      the container) by uid 0. Plain compose has no real
    #      UserNS=keep-id, so `user: "1000:1000"` maps to an unrelated host
    #      subuid that owns nothing on the mount. Omitting `user:` runs
    #      root-in-container, which under rootless podman's default subuid
    #      mapping IS the invoking host user for file-ownership purposes.
    # Reproduced with `stat .beads/metadata.json` and `bd list` (both
    # "Permission denied" / "no beads database found" until both fixes
    # applied together); cap_drop ALL + no-new-privileges + read_only
    # rootfs still apply, so this isn't a meaningfully weaker container
    # despite the nominal "root" label.
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      # Container-internal HOME, NOT the ${HOME} used below for the volume
      # path -- those two are different things and must stay different
      # (see the comment on `working_dir` and `volumes`). registry-watcher.js
      # writes $HOME/.beads/registry.json, a disposable discovery cache;
      # pointing it at /tmp (backed by the tmpfs below) means read_only
      # rootfs never blocks that write, mirroring n8n's own
      # /home/node/.cache tmpfs fix for the same class of gotcha.
      HOME: "/tmp"
      # beads-ui's own `bd` subprocess calls (server/bd.js) read BEADS_DIR
      # from their inherited env -- set explicitly rather than relying on
      # the cwd-walk alone, matching this project's convention everywhere
      # else BEADS_DIR is used.
      BEADS_DIR: "${HOME}/.beads-hub/hub/.beads"
    # `${HOME}` here is the COMPOSE variable substitution for the HOST's
    # home dir (used only for the volume path and working_dir below) --
    # unrelated to the container's own HOME=/tmp above. Do not collapse
    # these into one; they serve different purposes.
    working_dir: "${HOME}/.beads-hub/hub"
    # bdui is a core piece of the workbench (board front end), not opt-in
    # like n8n -- no profiles: gate, comes up by default.
    #
    # Host port 3100, not bdui's native 3000: the bare-host
    # `agent-workbench board up` tool (cli/board.py) free-port-scans
    # starting at 3000 on this same host, so publishing this container at
    # 3000 too would risk a same-host bind collision between the two
    # mechanisms. Internal container port stays bdui's native 3000.
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      # Whole hub tree, not just hub/: registered per-project board paths
      # inside the aggregator's own config are absolute host paths (e.g.
      # ~/.beads-hub/<name>/.beads), so cross-repo write-routing needs the
      # same absolute path to resolve inside the container too.
      - "${HOME}/.beads-hub:${HOME}/.beads-hub:rw"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      # See the SELinux note above -- without this, root-in-container still
      # gets EACCES on the bind-mounted board (MCS category mismatch).
      - "label:disable"
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      # Mirrors the Containerfile's baked HEALTHCHECK (node has no
      # curl/wget guarantee in the slim image).
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/'},res=>process.exit(res.statusCode<400?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  n8n:
    # Official image, no build block. Pinned by digest -- do not change
    # without deliberately re-pinning (see the quadlet's own comment on
    # how to re-pin on upgrade).
    image: "docker.io/n8nio/n8n@sha256:cda6bafc7bb4873533e7affb82d1bd47282a7614bdf83242c2293f8ff281261a"
    # n8n is opt-in: `docker-compose up` / `podman-compose up` with no
    # profile brings up only kb-serve + artifact-serve. n8n is intentionally
    # down right now by user choice; run with `--profile n8n` to include it.
    profiles:
      - n8n
    # ponytail: best-effort approximation of the quadlet's
    # User/Group/UserNS=keep-id -- unlike kb-serve, which had to drop this
    # override (see kb-serve's own comment above: plain compose has no
    # real UserNS=keep-id remap, so this maps to an unrelated host subuid).
    # n8n keeps the override for now since it isn't part of this cutover's
    # compose bring-up (profiled off, running from a pre-existing container
    # not started by this file) and untested here either way.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PUBLIC_API_DISABLED: "false"
    # Real, gitignored env file. N8N_ENCRYPTION_KEY is REQUIRED and n8n has
    # no _CMD vault-resolution fallback of its own (that convention is only
    # implemented by the quadlet's separate host-side n8n-secret.py
    # script). For this compose path, set the literal
    # N8N_ENCRYPTION_KEY=<value> (Mode 1, static) directly in the real
    # n8n.env below -- the Mode-2 vault _CMD variant only works via the
    # quadlet deploy path.
    env_file:
      - "${HOME}/.local/share/n8n/n8n.env"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - "${HOME}/.local/share/n8n:/home/node/.n8n:rw"
    # ponytail: best-effort/untested equivalent of the quadlet's
    # `Network=pasta:--map-host-loopback,169.254.1.2` fix (which lets n8n
    # workflows reach host-loopback services like ComfyUI/artifact-serve via
    # host.containers.internal). Plain compose has no pasta-specific
    # option; this may behave differently. n8n is profiled off by default,
    # so this isn't being relied on to be live by this change.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      # Both tmpfs mounts are required -- the quadlet's own comment
      # documents that n8n ENOENT-crash-loops on /home/node/.cache
      # without the second one.
      - /tmp
      - /home/node/.cache
    restart: unless-stopped
    healthcheck:
      # Mirrors the quadlet's HealthCmd. busybox wget is present in this
      # image, curl is not.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:5678/healthz
      interval: 30s
      timeout: 5s
      # First boot runs DB migrations; give it headroom before failures count.
      start_period: 30s
      retries: 3
